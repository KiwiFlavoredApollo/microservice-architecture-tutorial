server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: git
  rabbitmq:
    host: 172.30.1.13
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      server:
        git:
          uri: https://github.com/KiwiFlavoredApollo/spring-cloud-config
          default-label: main

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httpexchanges
          - busrefresh